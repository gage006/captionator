name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version shown in the app footer comes from frontend/package.json
      # (baked in by Vite). Refuse to release a tag that doesn't match it, so
      # the deployed footer can never disagree with the release tag. A short
      # vX.Y tag is treated as X.Y.0.
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in *.*.*) ;; *) tag="$tag.0" ;; esac
          pkg=$(node -p "require('./frontend/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} (=$tag) != frontend/package.json version $pkg. Bump package.json (+ lock) before tagging."
            exit 1
          fi

      # The fixture scripts need ffmpeg on the host (the runner image doesn't
      # ship it).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Fixture generation is slow (the speech fixture apt-installs espeak-ng
      # inside a throwaway container); cache the outputs keyed on the scripts.
      - name: Cache generated test fixtures
        uses: actions/cache@v4
        with:
          path: backend/tests/fixtures
          key: fixtures-${{ hashFiles('scripts/create_test_fixture.sh', 'scripts/create_real_speech_fixtures.sh') }}

      # Gehrig is skipped: it downloads from archive.org, which is too flaky a
      # dependency for CI. Its tests pytest.skip when the fixture is absent.
      - name: Generate speech fixture
        run: SKIP_GEHRIG=1 bash scripts/create_real_speech_fixtures.sh

      # Builds the stack with the dev override, waits for health, then runs
      # pytest + Playwright — the exact suite developers run locally.
      - name: Run e2e suite
        run: bash scripts/run-e2e.sh

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=300

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          # nginx builds the frontend assets and bakes them in, so its context
          # is the repo root and it needs an explicit Dockerfile path.
          - service: nginx
            context: .
            dockerfile: ./nginx/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # On pull requests, build only (verify it compiles) — never publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
