name: captionator

# Tunables shared by backend, worker, and beat (all run the same image). Values
# come from the project .env (docker compose reads it automatically for ${VAR}
# interpolation); the :-defaults apply when a var is unset, so the stack runs
# with no .env file too. REDIS_URL/STORAGE_PATH are deployment-fixed (they match
# the compose network and the volume mount) and are intentionally not tunable.
x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  STORAGE_PATH: /storage
  WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
  WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8_float32}
  WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
  VIDEO_ENCODER: ${VIDEO_ENCODER:-auto}
  CLEANUP_DELAY_SECONDS: ${CLEANUP_DELAY_SECONDS:-600}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2000}
  MAX_ACTIVE_JOBS: ${MAX_ACTIVE_JOBS:-10}
  RENDER_STALL_SECONDS: ${RENDER_STALL_SECONDS:-7200}
  SILENCE_THRESHOLD_DB: ${SILENCE_THRESHOLD_DB:--30.0}
  SILENCE_MIN_DURATION: ${SILENCE_MIN_DURATION:-0.5}
  SILENCE_PADDING: ${SILENCE_PADDING:-0.15}
  SILENCE_MAX_SEGMENTS: ${SILENCE_MAX_SEGMENTS:-60}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/gage006/captionator-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./backend/storage:/storage
      - whisper_cache:/home/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ghcr.io/gage006/captionator-backend:${IMAGE_TAG:-latest}
    build: ./backend
    command: celery -A app.tasks.celery_app worker --concurrency=1 --loglevel=info
    restart: unless-stopped
    environment: *app-env
    volumes:
      - ./backend/storage:/storage
      - whisper_cache:/home/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    # Ping the worker over the broker: catches a worker that's alive but can't reach
    # Redis (a crashed worker exits and is handled by restart, not by health). The
    # prefork MainProcess answers control pings even while the pool is mid-transcode,
    # so this stays green during long jobs. $$HOSTNAME -> the worker's node name.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME -t 10 >/dev/null 2>&1"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 40s

  beat:
    image: ghcr.io/gage006/captionator-backend:${IMAGE_TAG:-latest}
    build: ./backend
    # --schedule must point somewhere the non-root "app" user can write; the cwd
    # (/app) is root-owned. The schedule shelf is just last-run bookkeeping, so a
    # per-container path under /tmp is fine. This matches the in-code default
    # (celery_app.beat_schedule_filename), which backstops a bare `celery beat`.
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    restart: unless-stopped
    environment: *app-env
    # Beat configures the same Celery app, which initializes the SQLite DB on
    # startup; mount storage so that write lands on the shared DB, not a throwaway
    # path inside the container.
    volumes:
      - ./backend/storage:/storage
    depends_on:
      redis:
        condition: service_healthy
    # No healthcheck by design: beat runs as PID 1, so a crash exits the container
    # and `restart` recovers it; it isn't a worker node, so `inspect ping` can't see
    # it; and a wedged-but-alive beat only delays cleanup, which sweep_expired_jobs +
    # the per-job countdown already backstop.

  nginx:
    image: ghcr.io/gage006/captionator-nginx:${IMAGE_TAG:-latest}
    # Build context is the repo root so the image can compile the frontend
    # assets (./frontend) and bake them in alongside the edge proxy config.
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # nginx is now the static layer too (assets baked in), so it owns the probe
    # the frontend service used to. GET / serves the local index.html.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  whisper_cache:
