name: captionator

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    image: ghcr.io/gage006/captionator-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/storage
      - WHISPER_MODEL=base.en
    volumes:
      - ./backend/storage:/storage
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      - redis

  worker:
    image: ghcr.io/gage006/captionator-backend:${IMAGE_TAG:-latest}
    build: ./backend
    command: celery -A app.tasks.celery_app worker --concurrency=1 --loglevel=info
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/storage
      - WHISPER_MODEL=base.en
    volumes:
      - ./backend/storage:/storage
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      - redis

  beat:
    image: ghcr.io/gage006/captionator-backend:${IMAGE_TAG:-latest}
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/storage
      - WHISPER_MODEL=base.en
    depends_on:
      - redis

  frontend:
    image: ghcr.io/gage006/captionator-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: ghcr.io/gage006/captionator-nginx:${IMAGE_TAG:-latest}
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  whisper_cache:
