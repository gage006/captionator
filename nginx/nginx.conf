events {
  worker_connections 1024;
}

http {
  client_max_body_size 2000m;
  client_body_timeout 600s;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  # Use Docker's internal DNS so the backend name re-resolves after container restarts
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 5s;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;

    # Static SPA build is baked into this image (see Dockerfile), served directly.
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      set $backend backend:8000;
      proxy_pass http://$backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_request_buffering off;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: serve index.html for any path the build doesn't have a file for.
    location / {
      try_files $uri /index.html;
    }
  }
}
